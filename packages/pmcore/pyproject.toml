[project]
name = "pmcore"
version = "0.1.0"
description = "Shared code for power-markets: NYISO public files, admission by posting time, statistics, run records."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=17", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmcore"]
